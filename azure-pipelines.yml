trigger:
- main

pool:
  name: Default  # Your self-hosted agent pool

variables:
  SONAR_HOST_URL: 'http://localhost:9000'
  SONAR_TOKEN: 'sqp_8d80e214f6e676d998441fd56a0be130552bac12'
  SONAR_PROJECT_KEY: 'tripbuddy'
  COMPOSE_PROJECT_NAME: 'tripbuddy'
  # Docker image tags
  BUILD_ID: '$(Build.BuildId)'
  BACKEND_IMAGE: 'tripbuddy-backend:$(Build.BuildId)'
  FRONTEND_IMAGE: 'tripbuddy-frontend:$(Build.BuildId)'
  PROMETHEUS_IMAGE: 'tripbuddy-prometheus:$(Build.BuildId)'
  GRAFANA_IMAGE: 'tripbuddy-grafana:$(Build.BuildId)'
  # Trivy results directory
  TRIVY_RESULTS_DIR: '/home/azureuser/trivy-scanner/results/$(Build.BuildId)'
  # Centralized environment file path on agent
  AGENT_ENV_FILE: '/home/azureuser/app_variables/.env'

stages:
- stage: UnitTests
  displayName: 'Unit Tests'
  jobs:
  - job: RunUnitTests
    displayName: 'Run Pytest Unit Tests'
    steps:
    - checkout: self
      displayName: 'Checkout Code'

    - script: |
        python3 -m venv /tmp/tripbuddy-ci-venv
        /tmp/tripbuddy-ci-venv/bin/pip install --upgrade pip
        /tmp/tripbuddy-ci-venv/bin/pip install -r requirements.txt
        /tmp/tripbuddy-ci-venv/bin/pip install prometheus-client
        cd TripBuddy/backend
        /tmp/tripbuddy-ci-venv/bin/pytest tests/test_backend.py -v --tb=short \
          --junit-xml=../../test-results/unit-tests.xml
      displayName: 'Run Backend Unit Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Unit Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/unit-tests.xml'
        testRunTitle: 'Unit Tests'

- stage: AISecurityTests
  displayName: 'AI Security Tests'
  dependsOn: UnitTests
  jobs:
  - job: RunAISecurityTests
    displayName: 'Run AI Security Test Suite'
    steps:
    - checkout: self
      displayName: 'Checkout Code'

    - script: |
        python3 -m venv /tmp/tripbuddy-ci-venv
        /tmp/tripbuddy-ci-venv/bin/pip install --upgrade pip
        /tmp/tripbuddy-ci-venv/bin/pip install -r requirements.txt
        /tmp/tripbuddy-ci-venv/bin/pip install prometheus-client
        cd TripBuddy/backend
        /tmp/tripbuddy-ci-venv/bin/pytest tests/test_ai_security.py -v --tb=short \
          --junit-xml=../../test-results/ai-security-tests.xml
      displayName: 'Run AI Security Tests'

    - task: PublishTestResults@2
      displayName: 'Publish AI Security Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/ai-security-tests.xml'
        testRunTitle: 'AI Security Tests'

- stage: CodeAnalysis
  displayName: 'Code Quality Analysis'
  dependsOn: AISecurityTests
  jobs:
  - job: SonarScan
    displayName: 'SonarQube Scan'
    steps:
    - checkout: self
      displayName: 'Checkout Code'
    
    - script: |
        sonar-scanner \
          -Dsonar.projectKey=$(SONAR_PROJECT_KEY) \
          -Dsonar.sources=. \
          -Dsonar.host.url=$(SONAR_HOST_URL) \
          -Dsonar.token=$(SONAR_TOKEN)
      displayName: 'Run SonarQube Analysis'

- stage: ApprovalAfterSonar
  displayName: 'Approval - Code Quality Review'
  dependsOn: CodeAnalysis
  jobs:
  - job: waitForValidation
    displayName: 'Wait for Code Quality Approval'
    pool: server
    timeoutInMinutes: 4320  # 3 days
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'clement_tay@outlook.com'  # Replace with your email
        instructions: 'Please review the SonarQube scan results at $(SONAR_HOST_URL)/dashboard?id=$(SONAR_PROJECT_KEY) before proceeding to build.'
        onTimeout: 'reject'

- stage: Build
  displayName: 'Build Docker Images'
  dependsOn: ApprovalAfterSonar
  jobs:
  - job: DockerBuild
    displayName: 'Build All Docker Images'
    steps:
    - checkout: self
      displayName: 'Checkout Code'
    
    - script: |
        # Verify agent environment file exists
        if [ ! -f $(AGENT_ENV_FILE) ]; then
          echo "ERROR: Environment file not found at $(AGENT_ENV_FILE)"
          exit 1
        fi
        
        echo "Using environment file from: $(AGENT_ENV_FILE)"
        
        # Copy the centralized .env file to workspace
        cp $(AGENT_ENV_FILE) .env.prod
        
        # Also copy to backend directory for backend-specific env vars
        cp $(AGENT_ENV_FILE) TripBuddy/backend/.env.prod
        
        echo "Environment files prepared successfully"
      displayName: 'Prepare Environment Files from Agent'
    
    - script: |
        # Export image names with build ID
        export BACKEND_IMAGE=$(BACKEND_IMAGE)
        export FRONTEND_IMAGE=$(FRONTEND_IMAGE)
        export PROMETHEUS_IMAGE=$(PROMETHEUS_IMAGE)
        export GRAFANA_IMAGE=$(GRAFANA_IMAGE)
        
        # Build all services
        docker compose --env-file .env.prod -f docker-compose.prod.yml build
      displayName: 'Build Docker Images with Docker Compose'
    
    - script: |
        # Tag images with 'latest' as well
        docker tag $(BACKEND_IMAGE) tripbuddy-backend:latest
        docker tag $(FRONTEND_IMAGE) tripbuddy-frontend:latest
        docker tag $(PROMETHEUS_IMAGE) tripbuddy-prometheus:latest
        docker tag $(GRAFANA_IMAGE) tripbuddy-grafana:latest
      displayName: 'Tag Images as Latest'
    
    - script: |
        echo "Built images:"
        docker images | grep tripbuddy
      displayName: 'List Built Images'

- stage: SecurityScan
  displayName: 'Security Scanning'
  dependsOn: Build
  jobs:
  - job: TrivyScan
    displayName: 'Trivy Vulnerability Scan'
    steps:
    - script: |
        # Create results directory for this build
        mkdir -p $(TRIVY_RESULTS_DIR)
        echo "Trivy results will be saved to: $(TRIVY_RESULTS_DIR)"
      displayName: 'Create Trivy Results Directory'
    
    - script: |
        echo "Scanning Backend Image..."
        trivy image --severity HIGH,CRITICAL \
          --format table \
          --output $(TRIVY_RESULTS_DIR)/backend_results.txt \
          $(BACKEND_IMAGE)
        
        echo "Backend scan completed. Results saved to: $(TRIVY_RESULTS_DIR)/backend_results.txt"
        cat $(TRIVY_RESULTS_DIR)/backend_results.txt
      displayName: 'Scan Backend Image'
      continueOnError: true
    
    - script: |
        echo "Scanning Frontend Image..."
        trivy image --severity HIGH,CRITICAL \
          --format table \
          --output $(TRIVY_RESULTS_DIR)/frontend_results.txt \
          $(FRONTEND_IMAGE)
        
        echo "Frontend scan completed. Results saved to: $(TRIVY_RESULTS_DIR)/frontend_results.txt"
        cat $(TRIVY_RESULTS_DIR)/frontend_results.txt
      displayName: 'Scan Frontend Image'
      continueOnError: true
    
    - script: |
        echo "Scanning Prometheus Image..."
        trivy image --severity HIGH,CRITICAL \
          --format table \
          --output $(TRIVY_RESULTS_DIR)/prometheus_results.txt \
          $(PROMETHEUS_IMAGE)
        
        echo "Prometheus scan completed. Results saved to: $(TRIVY_RESULTS_DIR)/prometheus_results.txt"
        cat $(TRIVY_RESULTS_DIR)/prometheus_results.txt
      displayName: 'Scan Prometheus Image'
      continueOnError: true
    
    - script: |
        echo "Scanning Grafana Image..."
        trivy image --severity HIGH,CRITICAL \
          --format table \
          --output $(TRIVY_RESULTS_DIR)/grafana_results.txt \
          $(GRAFANA_IMAGE)
        
        echo "Grafana scan completed. Results saved to: $(TRIVY_RESULTS_DIR)/grafana_results.txt"
        cat $(TRIVY_RESULTS_DIR)/grafana_results.txt
      displayName: 'Scan Grafana Image'
      continueOnError: true
    
    - script: |
        echo "=========================================="
        echo "Security Scan Summary"
        echo "=========================================="
        echo "Build ID: $(Build.BuildId)"
        echo "Results Location: $(TRIVY_RESULTS_DIR)"
        echo ""
        echo "Scan Results Files:"
        ls -lh $(TRIVY_RESULTS_DIR)/
        echo ""
        echo "Total vulnerabilities found:"
        echo "Backend:"
        grep -c "HIGH\|CRITICAL" $(TRIVY_RESULTS_DIR)/backend_results.txt || echo "0"
        echo "Frontend:"
        grep -c "HIGH\|CRITICAL" $(TRIVY_RESULTS_DIR)/frontend_results.txt || echo "0"
        echo "Prometheus:"
        grep -c "HIGH\|CRITICAL" $(TRIVY_RESULTS_DIR)/prometheus_results.txt || echo "0"
        echo "Grafana:"
        grep -c "HIGH\|CRITICAL" $(TRIVY_RESULTS_DIR)/grafana_results.txt || echo "0"
      displayName: 'Security Scan Summary'

- stage: ApprovalBeforeDeploy
  displayName: 'Approval - Deploy to Production'
  dependsOn: SecurityScan
  jobs:
  - job: waitForValidation
    displayName: 'Wait for Deployment Approval'
    pool: server
    timeoutInMinutes: 4320  # 3 days
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'clement_tay@outlook.com'  # Replace with your email
        instructions: 'Please review the build and security scan results at $(TRIVY_RESULTS_DIR) before deploying to production.'
        onTimeout: 'reject'

- stage: Deploy
  displayName: 'Deploy Application'
  dependsOn: ApprovalBeforeDeploy
  jobs:
  - job: DeployDocker
    displayName: 'Deploy Docker Stack'
    steps:
    - checkout: self
      displayName: 'Checkout Code'
    
    - script: |
        # Verify agent environment file exists
        if [ ! -f $(AGENT_ENV_FILE) ]; then
          echo "ERROR: Environment file not found at $(AGENT_ENV_FILE)"
          exit 1
        fi
        
        echo "Using environment file from: $(AGENT_ENV_FILE)"
        
        # Copy the centralized .env file to workspace
        cp $(AGENT_ENV_FILE) .env.prod
        
        # Also copy to backend directory
        cp $(AGENT_ENV_FILE) TripBuddy/backend/.env.prod
        
        echo "Environment files prepared successfully"
      displayName: 'Prepare Environment Files from Agent'
    
    - script: |
        # Stop existing stack if running
        docker compose --env-file .env.prod -f docker-compose.prod.yml down || true
      displayName: 'Stop Existing Stack'
    
    - script: |
        # Export image names with build ID
        export BACKEND_IMAGE=$(BACKEND_IMAGE)
        export FRONTEND_IMAGE=$(FRONTEND_IMAGE)
        export PROMETHEUS_IMAGE=$(PROMETHEUS_IMAGE)
        export GRAFANA_IMAGE=$(GRAFANA_IMAGE)
        
        # Rolling deployment – updates one service at a time with health-check
        # gating. Automatically rolls back to :latest images if any service
        # fails its health check.
        chmod +x deploy.sh
        ENV_FILE=.env.prod \
        COMPOSE_FILE=docker-compose.prod.yml \
        HEALTH_TIMEOUT=120 \
        ./deploy.sh \
          "$(BACKEND_IMAGE)" \
          "$(FRONTEND_IMAGE)" \
          "$(PROMETHEUS_IMAGE)" \
          "$(GRAFANA_IMAGE)"
      displayName: 'Rolling Deploy with Health-Check Gating'
    
    - script: |
        # Load environment variables to display ports
        set -a
        source .env.prod
        set +a
        
        echo "=========================================="
        echo "Deployment Summary"
        echo "=========================================="
        echo "Build ID: $(Build.BuildId)"
        echo ""
        echo "Service URLs:"
        echo "  Backend: http://localhost:${BACKEND_PORT:-8000}"
        echo "  Frontend: http://localhost:${FRONTEND_PORT:-80}"
        echo "  Prometheus: http://localhost:${PROMETHEUS_PORT:-9090}"
        echo "  Grafana: http://localhost:${GRAFANA_PORT:-3000}"
        echo ""
        echo "Running containers:"
        docker compose --env-file .env.prod -f docker-compose.prod.yml ps
        echo ""
        echo "Container health status:"
        docker ps --filter "name=tripbuddy" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      displayName: 'Deployment Summary'
