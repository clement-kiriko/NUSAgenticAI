services:
  backend:
    image: ${BACKEND_IMAGE:-tripbuddy-backend:latest}
    env_file:
      - TripBuddy/backend/.env.prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-tripbuddy-frontend:latest}
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-tripbuddy-prometheus:latest}
    depends_on:
      - backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-tripbuddy-grafana:latest}
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
