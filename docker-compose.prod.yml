services:
  backend:
    image: ${BACKEND_IMAGE:-tripbuddy-backend:latest}
    build:
      context: .
      dockerfile: TripBuddy/backend/Dockerfile
    env_file:
      - TripBuddy/backend/.env.prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-tripbuddy-frontend:latest}
    build:
      context: .
      dockerfile: TripBuddy/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-tripbuddy-prometheus:latest}
    build:
      context: .
      dockerfile: TripBuddy/tools/prometheus/Dockerfile.prometheus
    depends_on:
      - backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-tripbuddy-grafana:latest}
    build:
      context: .
      dockerfile: TripBuddy/tools/prometheus/Dockerfile.grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
