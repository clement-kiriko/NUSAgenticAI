services:
  backend:
    image: ${BACKEND_IMAGE:-tripbuddy-backend:latest}
    build:
      context: .
      dockerfile: TripBuddy/backend/Dockerfile
    env_file:
      - TripBuddy/backend/.env.prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  frontend:
    image: ${FRONTEND_IMAGE:-tripbuddy-frontend:latest}
    build:
      context: .
      dockerfile: TripBuddy/frontend/Dockerfile
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  prometheus:
    image: ${PROMETHEUS_IMAGE:-tripbuddy-prometheus:latest}
    build:
      context: .
      dockerfile: TripBuddy/tools/prometheus/Dockerfile.prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  grafana:
    image: ${GRAFANA_IMAGE:-tripbuddy-grafana:latest}
    build:
      context: .
      dockerfile: TripBuddy/tools/prometheus/Dockerfile.grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  default:
    driver: overlay
    attachable: true

